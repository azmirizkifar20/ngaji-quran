name: Deploy via Tailscale SSH

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Connect to Tailscale 🕸️
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: 1.44.0

      - name: Deploy to Server 🚀
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            # Load Node.js from NVM for non-interactive SSH shell
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use --lts >/dev/null 2>&1 || nvm use default >/dev/null 2>&1 || true

            command -v node >/dev/null || { echo "❌ node not found in PATH"; exit 1; }
            command -v npm >/dev/null || { echo "❌ npm not found in PATH"; exit 1; }
            command -v pm2 >/dev/null || { echo "❌ pm2 not found in PATH"; exit 1; }

            cd /var/www/html/ngaji-quran
            git pull origin main

            echo "📦 Build backend"
            cd backend
            npm install
            npm run build
            pm2 startOrReload ecosystem.config.cjs --update-env

            echo "🎨 Build frontend (static)"
            cd ../frontend
            npm install
            npm run build

            echo "✅ Deploy ngaji-quran berhasil (frontend static via Nginx)"
